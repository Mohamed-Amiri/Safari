spring.application.name=SafariHub

# ===== Active Profile =====
spring.profiles.active=dev

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/SafariHub
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Server =====
server.port=8081

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-me-in-production-at-least-256-bits-long!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ===== Default Admin =====
app.admin.email=${ADMIN_EMAIL:admin@safarihub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.first-name=${ADMIN_FIRST_NAME:SafariHub}
app.admin.last-name=${ADMIN_LAST_NAME:Administrator}

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Logging =====
logging.level.com.safarihub=INFO
logging.level.org.springframework.security=INFO
