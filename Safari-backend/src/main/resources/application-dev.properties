# ===== Development Profile Overrides =====
# This file contains development-only settings (secrets, debug logging).
# NEVER use this profile in production.

# ===== MySQL Database (local dev) =====
spring.datasource.url=jdbc:mysql://localhost:3306/SafariHub
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate (dev verbose) =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT (dev key — rotate for production) =====
app.jwt.secret=SafariHub2024SuperSecretKeyForJWTTokenGenerationMustBe256Bits!!

# ===== CORS (dev origins) =====
app.cors-allowed-origins=http://localhost:4200,http://localhost:3000

# ===== Default Admin =====
app.admin.email=admin@safarihub.com
app.admin.password=Admin@123
app.admin.first-name=SafariHub
app.admin.last-name=Administrator

# ===== Logging (dev verbose) =====
logging.level.com.safarihub=DEBUG
logging.level.org.springframework.security=DEBUG
